# API Key 不再内联明文：全部加密存放在 security/api.key（已 gitignore，不进仓库），
# 运行时用解锁口令（环境变量 ASR_SECRETS_PASSPHRASE 或 security/.passphrase）解密填入。
# 下面 access_key / api_key / qwen_api_key 留空即可，由 utils/config_loader 从 api.key 覆盖。
# 换电脑：克隆后拷入 security/api.key 并提供口令即可恢复全部凭据；详见 security/ 与 secrets.plain.example.json。
app:
  sample_rate: 16000
  chunk_ms: 200        # 官方推荐 200ms，双向流式模式性能最优
  vad:
    threshold: 0.005        # 触发阈值下限（保护值），避免安静环境下噪声基线趋近 0 导致过度灵敏
    noise_multiplier: 3.5   # 自动模式下，实际触发阈值 = max(threshold, 环境噪声基线 × 该倍数)
    calibrate_frames: 15    # 自动模式进入等待状态后，先采样这么多帧校准噪声基线（15×200ms≈3s）
    start_frames: 2         # 连续超阈值帧数触发开始录音（2×200ms = 400ms）
    end_frames: 15          # 连续低于阈值帧数触发结束录音（15×200ms = 3s）；感觉太快/太慢可调这个数字

asr:
  app_id: "7938041955"
  access_key: ""   # 由 api.key 提供（volc_asr_access_key）
  resource_id: "volc.seedasr.sauc.duration"  # 豆包流式语音识别 2.0 小时版（该账号未开通 1.0）
  ws_url: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async"

# 二次识别 · 离线复识别：录音结束后用整段音频重识别一遍（看得到完整上下文，更准）
# 单人项目，key 直接写在这里跟仓库走（换机器拉下来即用）；若想分离可放 secrets.yaml 覆盖。
refine:
  offline:
    enabled: true
    backend: "volc"                    # volc=火山豆包录音文件识别2.0（已开通，base64直传无需对象存储）；qwen=阿里云百炼备选
    # --- volc 后端（推荐，实测最准最快）---
    resource_id: "volc.seedasr.auc"    # 豆包录音文件识别 2.0
    api_key: ""   # 由 api.key 提供（volc_file_api_key，火山录音文件识别 x-api-key）
    # --- qwen 后端（备选）---
    model: "qwen3-asr-flash"
    language: "zh"                     # 语种提示，留空自动判别
    qwen_api_key: ""   # 由 api.key 提供（dashscope_api_key）

correction:
  enabled: true                        # 复识别后再跑一遍 AI 文本校正（去结巴重复词、改同音错字）
  backend: "deepseek"                  # AI 文本校正走 DeepSeek 原生端点（千问只用于语音识别，不用于文本校正）
  model: "deepseek-chat"               # = deepseek-flash（V4.1-Flash），校正只去重去错字，用快且便宜的即可
  base_url: "https://api.deepseek.com/v1/chat/completions"
  api_key: ""   # 由 api.key 提供（deepseek_api_key）
  local_model_path: "models/qwen2.5-3b-instruct-q4_k_m.gguf"   # backend=local 时才用

# 邮件模式：把口述内容改写成邮件正文（采购主管口吻）。复用 correction 的 DeepSeek key/端点，
# 但用更强的模型追求质量（OpenAI 无法付款，故统一走 DeepSeek 最好的模型）。
compose:
  email:
    model: "deepseek-v4-pro"           # DeepSeek 最强模型；留空则回退用 correction.model

# 后台静默学习：从你的编辑中自动学术语/常错词 → 注入火山热词 + 本地保守替换
learn:
  enabled: true
  store_path: "~/.config/asr/vocab.json"
  hotword_limit: 50                    # 注入火山上游的热词上限（双向流式 context 约 100 tokens）
  min_correction_count: 2              # 同一个"错→对"被重复修正≥该次数才启用下游替换
