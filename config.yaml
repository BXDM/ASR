app:
  sample_rate: 16000
  chunk_ms: 200        # 官方推荐 200ms，双向流式模式性能最优
  vad:
    threshold: 0.005   # 归一化 RMS 阈值（0-1），可按环境调高/调低；0.005 ≈ 普通说话声
    start_frames: 2    # 连续超阈值帧数触发开始录音（2×200ms = 400ms）
    end_frames: 12     # 连续低于阈值帧数触发结束录音（12×200ms = 2.4s）

asr:
  app_id: "7707234985"
  access_key: "gNOQLQZe2eiEy2ZhTV9YKzXqHxBb6w9H"
  resource_id: "volc.bigasr.sauc.duration"   # 小时版；并发版用 volc.bigasr.sauc.concurrent
  ws_url: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel"

correction:
  enabled: true                              # 停止后是否自动跑一次 AI 校正
  backend: "local"                           # "local"（本地 Qwen，llama-cpp-python）或 "deepseek"
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com/v1/chat/completions"
  # api_key 从 secrets.yaml 读取（不进 git）
  local_model_path: "models/qwen2.5-3b-instruct-q4_k_m.gguf"
